name: rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released version to bring back, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: prod
  cancel-in-progress: false

env:
  SITE_ARCHIVE: site.tar.gz

jobs:
  deploy:
    name: Deploy a released artifact to prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Unpack the released artifact
        run: |
          gh release download "$TAG" --pattern "$SITE_ARCHIVE*"
          sha256sum -c "$SITE_ARCHIVE.sha256"
          mkdir -p site
          tar -xzf "$SITE_ARCHIVE" -C site
          echo "Rolling back to $TAG, $(cat "$SITE_ARCHIVE.sha256")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment

  smoke:
    name: Smoke on prod
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Browser for smoke
        run: npx playwright install --with-deps chromium

      - name: Published site is up
        run: npm run smoke
