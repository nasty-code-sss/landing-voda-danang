name: prod

on:
  workflow_run:
    workflows: [stage]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prod
  cancel-in-progress: false

env:
  SITE_ARCHIVE: site.tar.gz

jobs:
  version:
    name: Version is not released yet
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag of package.json version
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case "$status" in
            0)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "$tag is already released, nothing to deploy" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "$tag is new, it goes to prod after approval" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::cannot read tags of origin, git ls-remote exited with $status"
              exit 1
              ;;
          esac

  deploy:
    name: G3 deploy the stage artifact to prod
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Unpack the artifact checked on stage
        run: |
          sha256sum -c "$SITE_ARCHIVE.sha256"
          mkdir -p site
          tar -xzf "$SITE_ARCHIVE" -C site
          echo "Deploying $(cat "$SITE_ARCHIVE.sha256") checked by stage run ${{ github.event.workflow_run.id }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Tag and release the artifact
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" "$SITE_ARCHIVE" "$SITE_ARCHIVE.sha256" \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --notes "Site artifact from stage run ${{ github.event.workflow_run.id }}, rollback: run the rollback workflow with this tag"

  smoke:
    name: Smoke on prod
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Browser for smoke
        run: npx playwright install --with-deps chromium

      - name: Published site is up
        run: npm run smoke
